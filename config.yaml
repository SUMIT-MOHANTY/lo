database:
  primary:
    type: "sqlite"
    path: "/workspace/data/app.db"
  
azure:
  openai:
    api_key: "your-api-key-here"
    endpoint: "your-endpoint-here"
    api_version: "2023-05-15"

app:
  name: "FlaskAppSkeleton"
  version: "1.0.0"
  debug: true
  host: "0.0.0.0"
  port: 5000

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
